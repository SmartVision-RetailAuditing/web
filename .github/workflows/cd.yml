name: Frontend Docker Deploy (Development)

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Repo çek
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Azure login
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_WEB }}

      # 3. ACR login
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: smartvisioncontainerregistry.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME_WEB }}
          password: ${{ secrets.REGISTRY_PASSWORD_WEB }}

      # 4. Docker build & push (Frontend)
      - name: Build and Push Frontend Image
        run: |
          docker build . -t smartvisioncontainerregistry.azurecr.io/smartvision-frontend:${{ github.sha }}
          docker push smartvisioncontainerregistry.azurecr.io/smartvision-frontend:${{ github.sha }}

      # 5. Deploy to App Service
      - name: Deploy Frontend to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'smartvisionweb'
          images: 'smartvisioncontainerregistry.azurecr.io/smartvision-frontend:${{ github.sha }}'

      # 6. Azure logout
      - run: az logout